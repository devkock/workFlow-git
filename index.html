<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Senior Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"
            integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-12 text-center">
            <h1>Senior Sistemas Flow</h1>
            <h2>Selecione a etapa desejada</h2>

            <div style="display: flex; gap: 16px; flex-direction: column;">
                <div style="text-align: left;">
                    <h1>Analyst</h1>
                    <div class="gridButtons" id="button-container-analyst">
                    </div>
                </div>
                <div style="text-align: left;">
                    <h1>Backend</h1>
                    <div class="gridButtons" id="button-container-backend">
                    </div>
                </div>
                <div style="text-align: left;">
                    <h1>Develop</h1>
                    <div class="gridButtons" id="button-container-develop">
                    </div>
                </div>
                <div style="text-align: left;">
                    <h1>Estória</h1>
                    <div class="gridButtons" id="button-container-estoria">
                    </div>
                </div>
                <div style="text-align: left;">
                    <h1>Frontend</h1>
                    <div class="gridButtons" id="button-container-frontend">
                    </div>
                </div>
                <div style="text-align: left;">
                    <h1>QA</h1>
                    <div class="gridButtons" id="button-container-qa">
                    </div>
                </div>
                <div style="text-align: left;">
                    <h1>Outros Fluxos</h1>
                    <div class="gridButtons" id="button-container-flow">
                    </div>
                </div>
                <div style="text-align: left;">
                    <h1>Test Automation</h1>
                    <div class="gridButtons" id="button-container-test-automation">
                    </div>
                </div>
            </div>

            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-8">
                        <div class="d-none" id="result">
                            <p id="template" class="border-separator">
                            </p>
                            <p id="template-copy-phrase" class="d-none">
                                Template Copiado!
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="script.js"></script>

</body>
</html>
